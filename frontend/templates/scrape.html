{% extends "base.html" %}
{% block title %}Scrape Leads — Cold Email{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Scrape Leads</h2>

<div class="max-w-2xl">
    <form id="scrape-form" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Trade / Profession</label>
            <select name="trade" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-brand focus:border-brand">
                <option value="electrician">Electrician</option>
                <option value="plumber">Plumber</option>
                <option value="hvac">HVAC Contractor</option>
                <option value="roofer">Roofer</option>
                <option value="general contractor">General Contractor</option>
                <option value="handyman">Handyman</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Location (City, ST)</label>
            <input type="text" name="location" placeholder="Austin, TX" required
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-brand focus:border-brand">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Max Results per Source</label>
            <input type="number" name="max_results" value="20" min="5" max="100"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-brand focus:border-brand">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Sources</label>
            <div class="space-y-2">
                <label class="flex items-center gap-2">
                    <input type="checkbox" name="sources" value="google_maps" checked class="rounded border-gray-300 text-brand focus:ring-brand">
                    Google Maps
                </label>
                <label class="flex items-center gap-2">
                    <input type="checkbox" name="sources" value="yelp" checked class="rounded border-gray-300 text-brand focus:ring-brand">
                    Yelp
                </label>
                <label class="flex items-center gap-2">
                    <input type="checkbox" name="sources" value="license_dbs" class="rounded border-gray-300 text-brand focus:ring-brand">
                    License Databases (CA/TX/FL)
                </label>
            </div>
        </div>
        <div>
            <label class="flex items-center gap-2">
                <input type="checkbox" name="find_emails" checked class="rounded border-gray-300 text-brand focus:ring-brand">
                <span class="text-sm">Find email addresses from websites</span>
            </label>
        </div>
        <button type="submit" id="scrape-btn"
                class="px-6 py-2 bg-brand text-white rounded-lg hover:bg-blue-700 transition font-medium">
            Start Scraping
        </button>
    </form>

    <!-- Progress -->
    <div id="scrape-progress" class="hidden mt-6 border border-gray-200 rounded-lg p-4">
        <div class="flex items-center gap-3 mb-2">
            <div id="progress-spinner" class="animate-spin h-5 w-5 border-2 border-brand border-t-transparent rounded-full"></div>
            <span id="progress-message" class="text-sm text-gray-600">Starting...</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
            <div id="progress-bar" class="bg-brand h-2 rounded-full transition-all" style="width: 0%"></div>
        </div>
        <p id="progress-count" class="text-xs text-gray-500 mt-1"></p>
    </div>

    <!-- Results -->
    <div id="scrape-results" class="hidden mt-6 border border-green-200 bg-green-50 rounded-lg p-4">
        <p id="results-text" class="text-green-800 font-medium"></p>
        <div id="tier-summary" class="hidden flex gap-3 mt-2">
            <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-800" id="tier-hot"></span>
            <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800" id="tier-warm"></span>
            <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-600" id="tier-cool"></span>
            <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-500" id="tier-skip"></span>
        </div>
        <a href="/leads" class="inline-block mt-2 text-brand hover:underline text-sm">View leads &rarr;</a>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('scrape-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('scrape-btn');
    btn.disabled = true;
    btn.textContent = 'Scraping...';

    const sources = Array.from(form.querySelectorAll('input[name="sources"]:checked')).map(el => el.value);

    const res = await fetch('/api/scrape/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            trade: form.trade.value,
            location: form.location.value,
            max_results: parseInt(form.max_results.value),
            sources: sources,
            find_emails: form.find_emails.checked,
        })
    });
    const data = await res.json();

    if (data.error) {
        showToast(data.error, 'error');
        btn.disabled = false;
        btn.textContent = 'Start Scraping';
        return;
    }

    // Show progress and start SSE
    document.getElementById('scrape-progress').classList.remove('hidden');
    document.getElementById('scrape-results').classList.add('hidden');

    const evtSource = new EventSource(`/api/scrape/stream/${data.job_id}`);
    evtSource.onmessage = (event) => {
        const job = JSON.parse(event.data);
        document.getElementById('progress-message').textContent = job.message;
        if (job.total > 0) {
            const pct = Math.round((job.progress / job.total) * 100);
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('progress-count').textContent = `${job.progress} / ${job.total}`;
        }
        if (job.status === 'done') {
            evtSource.close();
            document.getElementById('progress-spinner').classList.add('hidden');
            document.getElementById('scrape-results').classList.remove('hidden');
            document.getElementById('results-text').textContent = job.message;
            if (job.tier_counts) {
                const ts = document.getElementById('tier-summary');
                ts.classList.remove('hidden');
                document.getElementById('tier-hot').textContent = job.tier_counts.hot + ' Hot';
                document.getElementById('tier-warm').textContent = job.tier_counts.warm + ' Warm';
                document.getElementById('tier-cool').textContent = job.tier_counts.cool + ' Cool';
                document.getElementById('tier-skip').textContent = job.tier_counts.skip + ' Skip';
            }
            btn.disabled = false;
            btn.textContent = 'Start Scraping';
        } else if (job.status === 'error') {
            evtSource.close();
            showToast(job.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Start Scraping';
        }
    };
});
</script>
{% endblock %}
